# kitty configuration — matches ~/.config/alacritty/alacritty.toml

# Font
font_family      family='JetBrainsMono Nerd Font'
bold_font        family='JetBrainsMono Nerd Font' style=Bold
italic_font      family='JetBrainsMono Nerd Font' style=Italic
bold_italic_font family='JetBrainsMono Nerd Font' style='Bold Italic'
font_size        12.0

# Window look
# Don't restore a maximized OS-window state when opening Kitty.
remember_window_size no
window_padding_width 0
hide_window_decorations yes
resize_in_steps yes

# Transparency + blur (like alacritty opacity=0.80, blur=true)
background_opacity 0.90
background_blur 1
dynamic_background_opacity yes

# Tokyo Night palette comes from the kitty built-in theme (current-theme.conf)

# Behavior parity with alacritty
copy_on_select yes
scrollback_lines 10000
enable_audio_bell no
allow_remote_control socket-only
listen_on unix:@kitty

# New tab/window/split inherits the current working directory
map ctrl+shift+t    new_tab_with_cwd
map ctrl+shift+enter new_window_with_cwd
# New OS window (separate Hyprland window) in the current directory
map ctrl+shift+n    new_os_window_with_cwd


# BEGIN_KITTY_THEME
# Tokyo Night
include current-theme.conf
# END_KITTY_THEME
